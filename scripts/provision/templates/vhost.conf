# Managed by scripts/provision.sh from scripts/provision/templates/vhost.conf.
# Edit the template, not this file: the next provision overwrites it.
#
# @ENV_LABEL@: https://@DOMAIN@ (Cloudflare -> tunnel on 192.168.1.10 -> here)
<VirtualHost *:80>
    ServerName @DOMAIN@
    @SERVER_ALIAS_DIRECTIVE@
    ServerAdmin webmaster@localhost
    DocumentRoot @APP_ROOT@/public

    <Directory @APP_DIR@>
        AllowOverride All
        Require all granted
    </Directory>

    # Cloudflare always reaches Apache on port 80, so HTTPS is never on here.
    # X-Forwarded-Proto says what the client actually used; redirect only when
    # that was plain HTTP. Direct LAN access sends no such header, so it is
    # left alone.
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =http
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # HSTS is production only. Staging is a throwaway host, and browsers must
    # not pin HTTPS for it after the container is rebuilt.
    @HSTS_DIRECTIVE@

    ErrorLog ${APACHE_LOG_DIR}/@LOG_NAME@-error.log
    CustomLog ${APACHE_LOG_DIR}/@LOG_NAME@-access.log combined

    Include /etc/apache2/steelerp-reverb.conf
</VirtualHost>
