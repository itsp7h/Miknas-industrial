# Provisioning values for staging (LXC steelERPstaging, 192.168.0.38).
# No secrets here: those live in the box's .env, which provisioning never writes.

# provision.sh refuses to run on any other machine, so `production` typed on
# the staging box (or the reverse) cannot write the wrong box's config.
EXPECTED_HOSTNAME=steelERPstaging

ENV_LABEL=Staging
APP_DIR=/var/www/ProjectsERP
WEB_USER=www-data
RUNNER_USER=runner

SITE_NAME=ProjectsERP
DOMAIN=staging-steelerp.p7h.me
# Also answers on the LAN IP, without the proxy.
SERVER_ALIAS_DIRECTIVE='ServerAlias 192.168.0.38'
LOG_NAME=ProjectsERP-staging
# No HSTS on staging: see the vhost template.
HSTS_DIRECTIVE=

# Reverb listens on every interface here: the staging smoke test still dials
# http://192.168.0.38:8080 directly. Apache proxies to it on loopback either way.
REVERB_BIND=0.0.0.0
REVERB_TARGET=127.0.0.1
REVERB_PORT=8080
