# Provisioning values for production (LXC SteelERP, 192.168.0.46).
# No secrets here: those live in the box's .env, which provisioning never writes.

# provision.sh refuses to run on any other machine.
EXPECTED_HOSTNAME=SteelERP

ENV_LABEL=Production
APP_DIR=/var/www/ProjectsERP
WEB_USER=www-data
RUNNER_USER=runner

SITE_NAME=ProjectsERP
DOMAIN=steelerp.p7h.me
# Reachable only through Cloudflare: no LAN alias.
SERVER_ALIAS_DIRECTIVE=
LOG_NAME=ProjectsERP
HSTS_DIRECTIVE='Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"'

# Reverb listens on loopback only; Apache is the only way in.
REVERB_BIND=127.0.0.1
REVERB_TARGET=127.0.0.1
REVERB_PORT=8080
