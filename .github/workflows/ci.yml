name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the Pint step can diff against the base commit.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sqlite3/pdo_sqlite: the app's driver, and phpunit runs on :memory:
          # zip + gd: phpoffice/phpspreadsheet and barryvdh/laravel-dompdf
          extensions: mbstring, bcmath, intl, zip, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Catches what a unit suite structurally cannot: a file that does not
      # parse never gets far enough to fail a test. Three notification classes
      # shipped broken this way and only surfaced when the class was loaded.
      - name: PHP syntax check
        run: |
          failed=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null 2>&1 || { echo "::error file=$file::PHP parse error"; php -l "$file" || true; failed=1; }
          done < <(find app database routes config tests packages -name '*.php' -not -path '*/vendor/*')
          exit $failed

      # Scoped to files this push/PR actually touched. The repo carries
      # pre-existing style drift across ~150 files; a one-time `vendor/bin/pint`
      # would clear it, but until then a repo-wide --test would fail every run
      # for reasons unrelated to the change under review.
      - name: Check formatting (Pint, changed files only)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit — skipping scoped format check."
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=ACM "$base" HEAD -- '*.php')
          if [ -z "$files" ]; then
            echo "No PHP files changed."
            exit 0
          fi
          echo "$files"
          # shellcheck disable=SC2086
          vendor/bin/pint --test $files

      - name: Run PHPUnit
        run: php artisan test

  js:
    name: JS tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run Vitest
        run: npm test

      # A green unit suite still ships a broken page if the bundle won't
      # build, so the build is part of CI rather than only of deploys.
      - name: Build assets
        run: npm run build
