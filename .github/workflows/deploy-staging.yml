name: Deploy staging

# Staging tracks `development` automatically, but only once CI is green —
# deploying a commit whose tests failed just moves the breakage somewhere more
# expensive. Production tracks `main`; see deploy-production.yml.
on:
  workflow_run:
    workflows: [CI]
    branches: [development]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    # Self-hosted: staging lives on a private LAN (192.168.0.38) that
    # GitHub-hosted runners cannot reach. See docs/ci-cd-setup.md.
    runs-on: [self-hosted, steelerp, staging]
    # Only a CI run for a *push* to development deploys. `branches:` above
    # matches the branch a CI run was for, whatever started it, so a pull
    # request from development (the release PR into main) redeployed staging
    # a second time — and so would a fork's PR from a branch it named
    # `development`. The repository check closes the fork case outright.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    steps:
      # Atomic: build, boot-check and migrate a release, then switch to it,
      # and switch back if /up fails. See scripts/steelerp-deploy.
      - name: Deploy
        run: sudo /usr/local/sbin/steelerp-deploy staging github/development

      # The websocket is checked on the public domain, the address a browser
      # dials, so the tunnel and Apache's proxy rules are covered as well.
      - name: Smoke test
        env:
          REVERB_URL: https://staging-steelerp.p7h.me
          REVERB_APP_KEY: ${{ secrets.STAGING_REVERB_APP_KEY }}
        run: /var/www/ProjectsERP/current/scripts/smoke-test.sh http://192.168.0.38

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed. If it failed before the switch the live" \
               "release was not touched; the database backup is in shared/storage/backups."
